name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the site files
        run: |
          mkdir _site
          cp index.html script.js style.css guestbook-config.js guestbook.js _site/
          cp robots.txt sitemap.xml _site/
          cp -R Audio Texts images _site/

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Wait for the Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7; do
            if artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); then
              if [[ -n "$artifact_id" ]]; then
                echo "Pages artifact $artifact_id is available."
                # Let the Pages deployment API catch up with the Actions artifact API.
                sleep 10
                exit 0
              fi
            else
              echo "Artifact listing failed on attempt ${attempt}/7." >&2
            fi
            if [[ "$attempt" -lt 7 ]]; then
              sleep 5
            fi
          done
          echo "::error::The Pages artifact was not available after 30 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
